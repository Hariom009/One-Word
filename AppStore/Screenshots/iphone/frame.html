<!doctype html>
<!-- iPhone App Store frame: render.sh opens this once per slide (?n=0..) at 660x1434 @2x = 1320x2868 (6.9"). -->
<!-- Palette sampled from ../v1/designed so the iPhone set sits beside the Mac set. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: "Jakarta"; src: url("../../../OneWord/Fonts/PlusJakartaSans-Variable.ttf"); }
  :root { --ink: #10153A; --floor: #15204E; }
  html, body { margin: 0; width: 660px; height: 1434px; overflow: hidden; }
  body {
    position: relative;
    background: linear-gradient(180deg, #B3C1F4 0%, #D1DAF9 45%, #EDF1FD 100%);
    font-family: "Jakarta", -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* The soft arc in the Mac set's top-right corner. */
  body::before {
    content: ""; position: absolute; width: 900px; height: 900px; border-radius: 50%;
    left: 260px; top: -560px; background: rgba(255, 255, 255, .22);
  }
  /* The navy floor the Mac set's laptop stands on. */
  body::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: var(--floor);
  }
  h1 {
    position: relative; z-index: 1; margin: 0; padding: 92px 44px 0; text-align: center;
    font-size: 56px; line-height: 1.12; font-weight: 500; letter-spacing: -1px; color: var(--ink);
  }
  p {
    position: relative; z-index: 1; margin: 18px 56px 0; text-align: center;
    font-size: 25px; line-height: 1.35; font-weight: 400; color: #3A4170;
  }
  /* iPhone 17 Pro Max: 440x956 pt screen, scaled to 0.98 so it clears the headline. */
  .phone {
    position: absolute; z-index: 2; left: 50%; bottom: 72px; width: 452px; transform: translateX(-50%);
    padding: 13px; border-radius: 82px; background: #0B0B0D;
    box-shadow: 0 0 0 3px #3A3A44, 0 0 0 5px #8E92A6, 0 50px 90px rgba(21, 32, 78, .45);
  }
  .phone img { display: block; width: 100%; border-radius: 70px; }
</style>
<h1 id="title"></h1>
<p id="sub"></p>
<div class="phone"><img id="shot"></div>
<script>
  // Edit headlines here; order = App Store order.
  const SLIDES = [
    ["raw/home.png",         "One word a day",              "Meaning in English and Hindi, used in a real sentence."],
    ["raw/home_vein.png",    "Find words in the same vein", "Every word leads to its neighbours, so one becomes four."],
    ["raw/picture.png",      "Words you can see",           "The Picture Book pairs 243 everyday words with a photo."],
    ["raw/dictionaries.png", "Eight dictionaries",          "Emotions, Idioms, Philosophy, Sanskrit, Cats & Dogs and more."],
    ["raw/search.png",       "Search 24,000+ words",        "Every dictionary at once. Each result says where it's from."],
  ];
  const n = +new URLSearchParams(location.search).get("n") || 0;
  document.getElementById("shot").src = SLIDES[n][0];
  document.getElementById("title").textContent = SLIDES[n][1];
  document.getElementById("sub").textContent = SLIDES[n][2];
</script>
